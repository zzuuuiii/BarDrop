name: Report a bug
description: Something doesn’t work as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Drag an image from Safari to the right edge
        2.
  - type: input
    id: bardrop
    attributes:
      label: BarDrop version
      description: Settings → About BarDrop
      placeholder: "1.31.0-beta.10"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: With a beta version, turn on the diagnostic log in Settings → About BarDrop, reproduce the bug, then use “Save Log” and attach the file. Otherwise, filter for “com.zzuuuiii.bardrop” in the Console app and paste the relevant lines here. Please remove personal file names first.
      render: text
